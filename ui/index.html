<!doctype html>
<!--
  Nubisianua tab strip — the project's entire frontend.
  Plain HTML/CSS/JS, no framework, no build step (SPEC-0.0.3a-tabs.md §5).
  This page is the host window's own webview; the agents live in child
  webviews that Rust (src/tabs.rs) positions below this 40px strip.
  It talks to Rust through the Tauri global API (withGlobalTauri) using
  only the app's own commands — child webviews get no such access.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nubisianua</title>
<style>
  :root {
    --bg: #0b0e14;          /* matches the host window background (11,14,20) */
    --tab: #141a24;
    --tab-active: #1f2938;
    --line: #2a3342;
    --text: #d7dde6;
    --dim: #8b96a5;
    --gold: #d4a94e;        /* doorway gold, from the app icon */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 40px; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 12.5px/1.4 system-ui, "Segoe UI", sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  #strip { display: flex; align-items: stretch; height: 40px; padding: 5px 6px 0 6px; gap: 4px; }
  .tab {
    display: flex; align-items: center; gap: 7px;
    max-width: 190px; padding: 0 6px 0 11px;
    background: var(--tab); border: 1px solid transparent; border-bottom: none;
    border-radius: 7px 7px 0 0; cursor: pointer; white-space: nowrap;
  }
  .tab.active { background: var(--tab-active); border-color: var(--line); box-shadow: inset 0 -2px 0 var(--gold); }
  .tab .label { overflow: hidden; text-overflow: ellipsis; }
  .tab .close {
    flex: none; width: 17px; height: 17px; padding: 0;
    border: none; border-radius: 4px; background: transparent;
    color: var(--dim); font-size: 13px; line-height: 1; cursor: pointer;
  }
  .tab .close:hover { background: #3a2430; color: #ff9db0; }
  .tab input.rename {
    width: 110px; background: var(--bg); color: var(--text);
    border: 1px solid var(--gold); border-radius: 3px; font: inherit; padding: 1px 4px;
  }
  #add {
    flex: none; align-self: center; width: 24px; height: 24px;
    border: 1px solid var(--line); border-radius: 6px;
    background: var(--tab); color: var(--text); font-size: 15px; cursor: pointer;
  }
  #add:hover { background: var(--tab-active); }
  #menu {
    position: fixed; top: 42px; right: 6px; z-index: 10; width: 330px; max-width: 92vw;
    background: #12161f; border: 1px solid var(--line); border-radius: 8px;
    padding: 5px; box-shadow: 0 10px 28px rgba(0,0,0,.55);
  }
  #menu[hidden] { display: none; }
  #menu button {
    display: block; width: 100%; text-align: left; padding: 6px 9px;
    border: none; border-radius: 5px; background: transparent;
    color: var(--text); font: inherit; cursor: pointer;
  }
  #menu button:hover { background: var(--tab-active); }
  #menu .sep { border-top: 1px solid var(--line); margin: 5px 3px; }
  #menu .custom { color: var(--gold); }
</style>
</head>
<body>
  <div id="strip"></div>
  <div id="menu" hidden></div>

<script>
  const invoke = window.__TAURI__.core.invoke;
  const listen = window.__TAURI__.event.listen;

  let presets = [];
  let state = { tabs: [], activeTab: null };

  const strip = document.getElementById('strip');
  const menu = document.getElementById('menu');

  function render() {
    strip.textContent = '';
    for (const tab of state.tabs) {
      const el = document.createElement('div');
      el.className = 'tab' + (tab.id === state.activeTab ? ' active' : '');
      el.title = tab.url;

      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = tab.name;
      label.addEventListener('dblclick', (e) => { e.stopPropagation(); startRename(el, label, tab); });
      el.appendChild(label);

      const close = document.createElement('button');
      close.className = 'close';
      close.textContent = '×';
      close.title = 'Close tab';
      close.addEventListener('click', async (e) => {
        e.stopPropagation();
        try { await invoke('close_tab', { id: tab.id }); } catch (err) { console.error(err); }
      });
      el.appendChild(close);

      el.addEventListener('click', async () => {
        if (tab.id !== state.activeTab) {
          try { await invoke('activate_tab', { id: tab.id }); } catch (err) { console.error(err); }
        }
      });
      strip.appendChild(el);
    }
    const add = document.createElement('button');
    add.id = 'add';
    add.textContent = '+';
    add.title = 'New tab';
    add.addEventListener('click', (e) => { e.stopPropagation(); toggleMenu(); });
    strip.appendChild(add);
  }

  function startRename(el, label, tab) {
    const input = document.createElement('input');
    input.className = 'rename';
    input.value = tab.name;
    el.replaceChild(input, label);
    input.focus();
    input.select();
    let done = false;
    const commit = async (save) => {
      if (done) return;
      done = true;
      const name = input.value.trim();
      if (save && name && name !== tab.name) {
        try { await invoke('rename_tab', { id: tab.id, name }); return; }
        catch (err) { console.error(err); }
      }
      render();
    };
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') commit(true);
      else if (e.key === 'Escape') commit(false);
      e.stopPropagation();
    });
    input.addEventListener('blur', () => commit(true));
    input.addEventListener('click', (e) => e.stopPropagation());
  }

  function toggleMenu() {
    if (!menu.hidden) { menu.hidden = true; return; }
    menu.textContent = '';
    for (const p of presets) {
      const b = document.createElement('button');
      b.textContent = p.name;
      b.addEventListener('click', async () => {
        menu.hidden = true;
        try { await invoke('create_tab', { name: p.name, url: p.url }); }
        catch (err) { alert(String(err)); }
      });
      menu.appendChild(b);
    }
    const sep = document.createElement('div');
    sep.className = 'sep';
    menu.appendChild(sep);
    const custom = document.createElement('button');
    custom.className = 'custom';
    custom.textContent = 'Custom URL — any agent, including a local model you run yourself (Glimmer, Spark Open, …)';
    custom.addEventListener('click', async () => {
      menu.hidden = true;
      const url = prompt('Open a new tab at this URL (https://…, or http://localhost:port for a local model):', '');
      if (!url) return;
      let name = '';
      try { name = new URL(url.includes('://') ? url : 'https://' + url).hostname; } catch { /* Rust validates */ }
      try { await invoke('create_tab', { name: name || 'Custom', url }); }
      catch (err) { alert(String(err)); }
    });
    menu.appendChild(custom);
    menu.hidden = false;
  }

  document.addEventListener('click', () => { menu.hidden = true; });

  // Shortcuts (SPEC §1). Note: these fire while this strip has focus; keys
  // typed into an agent page belong to that page, and no webview lets a
  // wrapper steal them — see the 0.0.3a build notes.
  document.addEventListener('keydown', async (e) => {
    if (!e.ctrlKey) return;
    if (e.key === 't' || e.key === 'T') { e.preventDefault(); toggleMenu(); }
    else if (e.key === 'w' || e.key === 'W') {
      e.preventDefault();
      if (state.activeTab) { try { await invoke('close_tab', { id: state.activeTab }); } catch (err) { console.error(err); } }
    } else if (e.key === 'Tab') {
      e.preventDefault();
      try { await invoke('cycle_tab', { delta: e.shiftKey ? -1 : 1 }); } catch (err) { console.error(err); }
    }
  });

  (async () => {
    try {
      presets = await invoke('get_presets');
      state = await invoke('get_state');
      render();
      await listen('tabs-changed', (event) => { state = event.payload; render(); });
    } catch (err) {
      console.error(err);
    }
  })();
</script>
</body>
</html>
