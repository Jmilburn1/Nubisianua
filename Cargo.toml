[package]
name = "nubisianua"
version = "0.0.17-a"
description = "A lightweight doorway to your cloud AI — a small native window for Muse on Windows and Linux, no browser required."
authors = ["John Milburn"]
license = "MIT"
edition = "2021"

# The crate root IS the Tauri app directory in this scaffold
# (tauri.conf.json, build.rs, capabilities/ and icons/ live beside Cargo.toml).

[build-dependencies]
# Pinned exactly: the multi-webview APIs used for tabs live behind tauri's
# `unstable` feature, and tauri-build must move in lockstep with tauri.
# Bump only in dedicated, tested steps (see SPEC-0.0.3a-tabs.md §3).
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["unstable"] }
# tabs.json load/save (src/config.rs). The spec expected "no new crates";
# hand-rolling JSON for user-editable tab labels would be the fragile
# option, so serde is the one deliberate addition.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# v0.0.11a: hand cross-origin new-window requests from tab webviews to the
# OS default browser (src/tabs.rs). Used from Rust only — tab webviews
# keep zero IPC/capabilities, so no opener permission is granted to any
# webview; the plugin is initialized in main.rs purely so its Rust-side
# OpenerExt is available to the app itself.
tauri-plugin-opener = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# The same gtk Tauri 2.12 itself depends on (0.18), so the types unify.
# Used by the Linux shelf-layout pass in src/tabs.rs (v0.0.8a),
# which drives the window's GtkBox directly — see the long comment
# there for why Linux needs it and Windows doesn't — and, since
# v0.0.15a, for its gdk_pixbuf re-export, which loads and
# re-encodes dropped images for the clipboard bridge.
gtk = { version = "0.18", features = ["v3_24"] }
# The exact version wry/tauri already lock (their `=2.0.2` pin), so
# the WebView type unifies with the one `Webview::with_webview`
# hands out through `PlatformWebview::inner()`. Used since
# v0.0.17a by the auto-paste in src/tabs.rs, which calls WebKit's
# native Paste editing command on the dropped-on tab's WebView.
webkit2gtk = "=2.0.2"

[profile.release]
lto = true
codegen-units = 1
